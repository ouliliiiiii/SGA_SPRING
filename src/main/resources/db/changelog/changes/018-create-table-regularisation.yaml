databaseChangeLog:
  - changeSet:
      id: 018-create-table-regularisation
      author: mme niane
      changes:
        - createTable:
            tableName: regularisation
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_agent
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: date_debut
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: date_fin
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: moment_debut
                  type: VARCHAR(20)
              - column:
                  name: moment_fin
                  type: VARCHAR(20)
              - column:
                  name: nb_jours
                  type: NUMERIC(6,2)
                  constraints:
                    nullable: false
              - column:
                  name: date_operation
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: effectue_par
                  type: VARCHAR(150)
        - addForeignKeyConstraint:
            baseTableName: regularisation
            baseColumnNames: id_agent
            referencedTableName: agent
            referencedColumnNames: id
            constraintName: fk_regularisation_agent