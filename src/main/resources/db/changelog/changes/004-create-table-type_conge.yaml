databaseChangeLog:
  - changeSet:
      id: 004-create-table-type_conge
      author: mme niane
      changes:
        - createTable:
            tableName: type_conge
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: libelle
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: categorie
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: justificatif_requis
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: duree_maximale
                  type: INT
              - column:
                  name: reserve_femme
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: compte_jours_ouvres
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: actif
                  type: BOOLEAN
                  constraints:
                    nullable: false
