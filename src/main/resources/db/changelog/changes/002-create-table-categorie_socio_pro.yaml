databaseChangeLog:
  - changeSet:
      id: 002-create-table-categorie_socio_pro
      author: mme niane
      changes:
        - createTable:
            tableName: categorie_socio_pro
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: libelle
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: actif
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: date_creation
                  type: TIMESTAMP
                  constraints:
                    nullable: false
