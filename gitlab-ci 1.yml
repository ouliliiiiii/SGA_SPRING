stages:
  - build
  - test
  - package
  - docker
  - deploy-preprod
  - deploy-prod

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/sga-backend
  IMAGE_TAG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

build-job:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  before_script:
    - cd backend
  script:
    - echo "Build du projet SGA..."
    - mvn clean compile -B
  artifacts:
    paths:
      - backend/target/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH'

test-job:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - postgres:15
  variables:
    POSTGRES_DB: sga_test
    POSTGRES_USER: sga
    POSTGRES_PASSWORD: sga_password
    POSTGRES_HOST_AUTH_METHOD: trust
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sga_test
    SPRING_DATASOURCE_USERNAME: sga
    SPRING_DATASOURCE_PASSWORD: sga_password
    SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    SPRING_FLYWAY_ENABLED: "false"
    SPRING_AI_OPENAI_API_KEY: "sk-dummy-key-for-ci-testing-only"
  before_script:
    - cd backend
  script:
    - echo "Tests unitaires..."
    - mvn test -B
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH'

package-job:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  before_script:
    - cp settings.xml backend/settings.xml
    - cd backend
  script:
    - echo "Build du JAR..."
    - mvn package -B -DskipTests
    - echo "Upload JAR dans le Package Registry..."
    - mvn deploy -B -DskipTests -s settings.xml
    - echo "JAR disponible dans GitLab Package Registry"
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH'

docker-job:
  stage: docker
  image: docker:24
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Connexion au Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Build de l image Docker..."
    - docker build -t $IMAGE_NAME:$IMAGE_TAG ./backend
    - echo "Push de l image..."
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "Branche main : mise a jour du tag latest..."
        docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
        docker push $IMAGE_NAME:latest
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy-preprod:
  stage: deploy-preprod
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $PREPROD_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploiement sur PREPROD..."
    - ssh $PREPROD_USER@$PREPROD_HOST "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY && docker pull $IMAGE_NAME:$IMAGE_TAG && docker stop sga-preprod 2>/dev/null || true && docker rm sga-preprod 2>/dev/null || true && docker run -d --name sga-preprod -p 8080:8080 --restart unless-stopped $IMAGE_NAME:$IMAGE_TAG"
  environment:
    name: preprod
    url: http://$PREPROD_HOST:8080
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
  allow_failure: false

deploy-prod:
  stage: deploy-prod
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $PROD_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploiement sur PROD..."
    - ssh $PROD_USER@$PROD_HOST "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY && docker pull $IMAGE_NAME:$IMAGE_TAG && docker stop sga-prod 2>/dev/null || true && docker rm sga-prod 2>/dev/null || true && docker run -d --name sga-prod -p 8080:8080 --restart unless-stopped $IMAGE_NAME:$IMAGE_TAG"
  environment:
    name: production
    url: http://$PROD_HOST:8080
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false