stages:
  - build
  - test
  - package
  - deploy-preprod

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  BACKEND_DEPLOY_ROOT: /opt/sga-backend

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

build-job:
  stage: build
  tags:
    - srv-sga
  script:
    - echo "Build du projet SGA..."
    - mvn clean compile -B
  rules:
    - if: '$CI_COMMIT_BRANCH'

test-job:
  stage: test
  tags:
    - srv-sga
  variables:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://localhost:5432/sga_test"
    SPRING_DATASOURCE_USERNAME: "sga_test_app"
    SPRING_DATASOURCE_PASSWORD: "$SGA_TEST_DB_PASSWORD"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
    SPRING_FLYWAY_ENABLED: "false"
    SGA_JWT_SECRET: "test-secret-ne-pas-utiliser-en-prod-remplacer-par-valeur-aleatoire-64-car"
    SGA_JWT_EXPIRATION: "7200000"
    SGA_APP_URL: "http://localhost:4200"
    SGA_BACKEND_URL: "http://localhost:8080"
    SPRING_MAIL_HOST: "smtp.gmail.com"
    SPRING_MAIL_PORT: "587"
    SPRING_MAIL_USERNAME: "test@example.com"
    SPRING_MAIL_PASSWORD: "dummy-test-password"
  script:
    - echo "Tests unitaires..."
    - mvn test -B
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH'

package-job:
  stage: package
  tags:
    - srv-sga
  script:
    - echo "Build du JAR..."
    - mvn package -B -DskipTests
    - ls target/*.jar
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy-preprod:
  stage: deploy-preprod
  tags:
    - srv-sga
  needs:
    - package-job
  script:
    - RELEASE="$(date +%Y%m%d-%H%M%S)-$CI_COMMIT_SHORT_SHA"
    - mkdir -p "$BACKEND_DEPLOY_ROOT/releases/$RELEASE"
    - cp target/*.jar "$BACKEND_DEPLOY_ROOT/releases/$RELEASE/app.jar"
    - ln -sfn "$BACKEND_DEPLOY_ROOT/releases/$RELEASE" "$BACKEND_DEPLOY_ROOT/current"
    - sudo systemctl restart sga-backend
    - sleep 5
    - sudo systemctl status sga-backend --no-pager
    - 'echo "Deploye -> $RELEASE"'
    - cd "$BACKEND_DEPLOY_ROOT/releases" && ls -1t | tail -n +4 | xargs -r rm -rf
  environment:
    name: preprod
    url: http://10.100.226.67
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
  allow_failure: false